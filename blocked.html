<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='295 272 710 710'%3E%3Cpath fill='%2306284D' d='M310,380 C310,315 360,267 425,267 L880,267 C945,267 990,315 990,380 L990,640 C990,800 850,930 650,1027 C450,930 310,800 310,640 Z'/%3E%3Cpath fill='%23FFFFFF' d='M357,421 L943,421 L943,640 C943,780 820,890 649,975 C480,890 357,780 357,640 Z'/%3E%3Ccircle cx='414' cy='344' r='30' fill='%2336BBA8'/%3E%3Ccircle cx='508' cy='344' r='30' fill='%2336BBA8'/%3E%3Ccircle cx='601' cy='344' r='30' fill='%23FF5F43'/%3E%3Ccircle cx='616' cy='634' r='142' fill='none' stroke='%23029A8A' stroke-width='50'/%3E%3Cline x1='735' y1='735' x2='802' y2='810' stroke='%23029A8A' stroke-width='58' stroke-linecap='round'/%3E%3Cline x1='753' y1='507' x2='483' y2='773' stroke='%23FF5F43' stroke-width='46' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>Access Blocked</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: radial-gradient(circle at top, #1e1e2f, #0a0a12);
    overflow: hidden;
}

.overlay {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: rgba(20, 20, 40, 0.95);
    border-radius: 18px;
    padding: 40px 50px;
    width: 620px;
    text-align: center;
    color: #ffffff;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    animation: slideIn 0.8s ease-out;
    position: relative;
}

.lock {
    font-size: 64px;
    margin-bottom: 15px;
    animation: shake 2.5s infinite;
}

h1 {
    font-size: 38px;
    margin-bottom: 12px;
    color: #ff5f5f;
}

p {
    font-size: 25px;
    color: #d0d0ff;
    margin-bottom: 8px;
}

.reason {
    font-size: 23px;
    color: #9aa3ff;
    margin-bottom: 25px;
}

footer {
    font-size: 21px;
    color: #888;
}

.pulse {
    position: absolute;
    inset: -8px;
    border-radius: 22px;
    border: 2px solid rgba(255, 95, 95, 0.6);
    animation: pulse 2s infinite;
}

/* Animations */

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0% {
        opacity: 0.6;
    }
    50% {
        opacity: 0.15;
    }
    100% {
        opacity: 0.6;
    }
}

@keyframes shake {
    0% { transform: rotate(0deg); }
    2% { transform: rotate(-5deg); }
    4% { transform: rotate(5deg); }
    6% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
}

</style>

</head>
<body>
    <div class="overlay">
        <div class="card">
            <div class="lock">
                🔒
            </div>
            <h1>Site Blocked</h1>
            <p>
                This website has been blocked by your local content filter.
            </p>
            <p class="reason">
                Reason: Restricted keyword detected
            </p>

            <div class="pulse"></div>

            <footer>
                <span>Local Web Filter • Arnesh</span>
            </footer>
        </div>
    </div>
</body>
</html>
