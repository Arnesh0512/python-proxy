<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='295 272 710 710'%3E%3Cpath fill='%2306284D' d='M310,380 C310,315 360,267 425,267 L880,267 C945,267 990,315 990,380 L990,640 C990,800 850,930 650,1027 C450,930 310,800 310,640 Z'/%3E%3Cpath fill='%23FFFFFF' d='M357,421 L943,421 L943,640 C943,780 820,890 649,975 C480,890 357,780 357,640 Z'/%3E%3Ccircle cx='414' cy='344' r='30' fill='%2336BBA8'/%3E%3Ccircle cx='508' cy='344' r='30' fill='%2336BBA8'/%3E%3Ccircle cx='601' cy='344' r='30' fill='%23FF5F43'/%3E%3Ccircle cx='616' cy='634' r='142' fill='none' stroke='%23029A8A' stroke-width='50'/%3E%3Cline x1='735' y1='735' x2='802' y2='810' stroke='%23029A8A' stroke-width='58' stroke-linecap='round'/%3E%3Cline x1='753' y1='507' x2='483' y2='773' stroke='%23FF5F43' stroke-width='46' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>Settings Control</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .status {
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .blocked {
            background: #f8d7da;
            color: #721c24;
        }

        .unblocked {
            background: #d4edda;
            color: #155724;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .toggle-btn {
            background: #4e73df;
            color: white;
            width: 100%;
        }

        .otp-btn {
            background: #36b9cc;
            color: white;
        }

        .verify-btn {
            background: #1cc88a;
            color: white;
        }

        input {
            padding: 8px;
            width: 80%;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            text-align: center;
        }

        #msg {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Settings Control</h2>

    <div class="status {{ state }}">
        {{ state.upper() }}
    </div>

    <button class="toggle-btn" onclick="toggle()">Toggle Settings</button>

    <div id="otpBox" style="display:none;">
        <button class="otp-btn" onclick="sendOTP()">Send OTP</button><br>

        <input id="otp" placeholder="Enter OTP"><br>

        <button class="verify-btn" onclick="verifyOTP()">Verify OTP</button>
    </div>

    <p id="msg"></p>

</div>

<script>

async function toggle() {
    let res = await fetch("/toggle", {method: "POST"});
    let data = await res.json();

    if (data.status === "blocked") {
        location.reload();
    }
    else if (data.status === "otp_required") {
        document.getElementById("otpBox").style.display = "block";
    }
    else {
        document.getElementById("msg").innerText = data.error;
    }
}

async function sendOTP() {
    let res = await fetch("/send-otp", {method: "POST"});
    let data = await res.json();

    document.getElementById("msg").innerText = data.status || data.error;
}

async function verifyOTP() {
    let otp = document.getElementById("otp").value;

    let res = await fetch("/verify-otp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({otp: otp})
    });

    let data = await res.json();

    if (data.status === "unblocked") {
        location.reload();
    } else {
        document.getElementById("msg").innerText = data.error;
    }
}

</script>

</body>
</html>
